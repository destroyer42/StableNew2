name: StableNew CI

# One workflow per pull-request head: every PR base is covered (including stacked PRs that
# target another feature branch), so ordinary branch pushes do not start a duplicate run.
# Use workflow_dispatch for an explicit rerun or recovery.
on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# A newer head for the same PR (or manual ref) supersedes the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: repository truth + lint/types + isolated deterministic tests.
  # This job MUST pass. Failures are not masked.
  required:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pip tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff==0.14.9 mypy types-requests

    - name: Verify repository completeness
      run: |
        python tools/ci/check_repository_completeness.py

    - name: Enforce controller surface ratchet
      run: |
        python tools/ci/check_controller_surface.py

    - name: Lint (Ruff) — required
      run: |
        ruff check .

    - name: Run mypy smoke gate
      run: |
        python tools/ci/run_mypy_smoke.py

    - name: Collect the active test surface in isolation
      run: |
        python tools/ci/run_collection_gate.py

    - name: Run required positive-list smoke gate
      run: |
        python tools/ci/run_required_smoke.py

    - name: Verify the checkout remains clean
      run: |
        git diff --exit-code
        test -z "$(git status --porcelain --untracked-files=all)"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: required-test-results
        path: |
          .pytest_cache/

  # Informational gate: the broader configured suite (headless-safe GUI v2,
  # fake-backend integration, tools, video). It runs to completion (no
  # --maxfail) with a per-test timeout so one hang cannot mask the census, and
  # failures are reported without blocking merges. Success output is a concise
  # summary; failures and errors keep their diagnostics. Promote it to required
  # only after it is proven green.
  full-suite:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system deps for Tk (required for GUI tests)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install pip tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-xvfb pytest-timeout ruff==0.14.9

    - name: Run broader configured suite (Xvfb)
      uses: GabrielBB/xvfb-action@v1
      with:
        run: |
          python -m pytest -q -rfE --tb=short --timeout=300

    - name: Upload full test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: full-test-results
        path: |
          .pytest_cache/
