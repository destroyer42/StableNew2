name: StableNew CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Required gate: repository truth + lint/types + isolated deterministic tests.
  # This job MUST pass. Failures are not masked.
  required:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pip tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff==0.14.9 mypy types-requests

    - name: Verify repository completeness
      run: |
        python tools/ci/check_repository_completeness.py

    - name: Lint (Ruff) — required
      run: |
        python tools/ci/run_ruff_baseline.py

    - name: Run mypy smoke gate
      run: |
        python tools/ci/run_mypy_smoke.py

    - name: Collect the active test surface in isolation
      run: |
        python tools/ci/run_collection_gate.py

    - name: Run required positive-list smoke gate
      run: |
        python tools/ci/run_required_smoke.py

    - name: Verify the checkout remains clean
      run: |
        git diff --exit-code
        test -z "$(git status --porcelain --untracked-files=all)"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: required-test-results-${{ matrix.python-version }}
        path: |
          .pytest_cache/

  # Optional gate: the broader configured suite, including headless-safe GUI v2
  # and fake-backend journeys. Failures are reported but do not block merges.
  full-suite:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system deps for Tk (required for GUI tests)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install pip tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-xvfb ruff==0.14.9

    - name: Run broader configured suite (Xvfb)
      uses: GabrielBB/xvfb-action@v1
      with:
        run: |
          python -m pytest -vv --maxfail=5 --showlocals

    - name: Upload full test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: full-test-results-${{ matrix.python-version }}
        path: |
          .pytest_cache/
