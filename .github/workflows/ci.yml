name: StableNew CI

# One workflow per pull-request head: every PR base is covered (including stacked PRs that
# target another feature branch). A push to main also runs it, so a commit that bypasses a PR is never untested.
#
# The full census is the merge gate (PR-DEVEX-CI-160). tools/ci/validation_plan.py (repository-owned policy)
# classifies the base-to-head change set; this workflow only consumes its plan:
#   docs-only         -> cheap checks, no Python environment, no tests
#   executable change -> `required` (repository quality + cross-boundary contract gate), then ONE blocking full census
#                        (three independent file-level shards plus the aggregate `full-suite` verdict)
# There is no per-lane routing: every active test file runs for every executable change.
# Docs-only pushes to main use cheap checks; scheduled and manual runs always run the census.
on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1,3,5"  # Mon/Wed/Fri 07:00 UTC; cadence is policy, edit it here

# A newer head for the same PR supersedes the run still in flight; runs for main are never cancelled.
permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required gate: repository truth + lint/types + the cross-boundary contract suite. This job MUST pass and is
  # always present (its check name is the branch-protection identity), but it is cheap for docs-only changes.
  required:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      cheap_path: ${{ steps.plan.outputs.cheap_path }}
      full_census: ${{ steps.plan.outputs.full_census }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0

    - name: Previous-head evidence (docs-only follow-ups and base updates may reuse green evidence)
      id: prev
      if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        python3 tools/ci/previous_evidence.py --repo "$REPO" --before "$BEFORE_SHA" --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

    - name: Classify the change set (validation plan)
      id: plan
      env:
        EVENT: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        PREVIOUS_GREEN: ${{ steps.prev.outputs.green }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        args=(--event "$EVENT" --github-output "$GITHUB_OUTPUT")
        if [ "$EVENT" = "pull_request" ]; then
          args+=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [ "$PREVIOUS_GREEN" = "true" ]; then args+=(--before "$BEFORE_SHA" --previous-green); fi
        elif [ "$EVENT" = "push" ]; then
          args+=(--before "$BEFORE_SHA" --head "$PUSH_SHA")
        else
          args+=(--files tools/ci/validation_plan.py)  # scheduled/manual runs always validate the full tree
        fi
        python3 tools/ci/validation_plan.py "${args[@]}" | tee "$RUNNER_TEMP/plan.json"  # outside the checkout: it must stay clean

    - name: Cheap documentation checks (docs-only change or docs-only delta over green evidence)
      if: steps.plan.outputs.cheap_path == 'true'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        REUSE: ${{ steps.plan.outputs.reuse_previous_evidence }}
        EVENT: ${{ github.event_name }}
        PUSH_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "push" ]; then
          git diff --check "$BEFORE_SHA" "$PUSH_SHA"
        elif [ "$REUSE" = "true" ]; then
          git diff --check "$BEFORE_SHA" "$HEAD_SHA"
        else
          git diff --check "$BASE_SHA...$HEAD_SHA"
        fi
        python3 tools/ci/check_repository_completeness.py
        python3 tools/ci/check_controller_surface.py
        python3 tools/ci/ci_truth.py

    - name: Set up Python 3.14
      if: steps.plan.outputs.cheap_path != 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.14"

    - name: Install pip tools
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -r requirements-dev.txt

    - name: Verify repository completeness
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/check_repository_completeness.py

    - name: Enforce controller surface ratchet
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/check_controller_surface.py

    - name: Lint (Ruff) — required
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        ruff check .

    - name: Run mypy smoke gate
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/run_mypy_smoke.py

    - name: Run the whole-application mypy ratchet (no file may exceed its baseline)
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/run_mypy_ratchet.py --report "$RUNNER_TEMP/mypy-counts.json"

    - name: Run the formatting and blind/silent-exception ratchets
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/run_ruff_ratchets.py

    - name: Run the architecture-rule ratchets (threads, layering)
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/run_architecture_ratchets.py

    - name: Collect the active test surface in isolation
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/run_collection_gate.py

    - name: Run required positive-list gate (smoke + cross-boundary contracts)
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        python tools/ci/run_required_smoke.py

    - name: Verify the checkout remains clean
      if: steps.plan.outputs.cheap_path != 'true'
      run: |
        git diff --exit-code
        test -z "$(git status --porcelain --untracked-files=all)"

    - name: Upload validation plan
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: validation-plan
        path: ${{ runner.temp }}/plan.json

  # Blocking gate: the full configured suite (headless-safe GUI v2, fake-backend integration, tools, video).
  # PR-DEVEX-CENSUS-140: the census runs as THREE independent file-level shards (separate runner, Python
  # process, Xvfb and JUnit each) so its wall time is the slowest shard, not the whole suite. The partition is
  # `sha256(repo-relative test path) % 3` over the same active test files pytest collects (tools/ci/census_shards.py);
  # a new test file is assigned automatically. Each shard runs ordinary pytest to completion (no --maxfail) with a
  # per-test timeout. The aggregate `full-suite` job below is the census verdict and the branch-protection identity:
  # it fails closed if any shard artifact is missing, any active file is unassigned or doubly assigned, or any shard
  # failed, and it publishes one merged census. It runs for every executable change after the required gate succeeds.
  full-suite-shard:
    needs: required
    if: needs.required.outputs.full_census == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]  # keep in step with --shards 3 below (a truth test enforces it)

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python 3.14
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.14"

    - name: Install system deps for Tk (required for GUI tests)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install pip tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -r requirements-dev.txt

    - name: Run census shard ${{ matrix.shard }} of 3 (Xvfb)
      uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d  # v1
      with:
        run: |
          python tools/ci/census_shards.py run-shard --shards 3 --index ${{ matrix.shard }} --out-dir census-shard-results

    - name: Upload shard results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: census-shard-${{ matrix.shard }}
        path: census-shard-results/

  full-suite:
    needs: [required, full-suite-shard]
    if: ${{ always() && needs.required.result == 'success' && needs.required.outputs.full_census == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python 3.14
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.14"

    - name: Download shard results
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        pattern: census-shard-*
        merge-multiple: true
        path: census-results

    - name: Verify census completeness and summarize
      run: |
        set -o pipefail
        python tools/ci/census_shards.py verify --shards 3 --results-dir census-results --json census-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload full test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()
      with:
        name: full-test-results
        path: |
          census-results/
          census-summary.json

  # Windows platform contract (audit P1-3). StableNew is a Windows desktop application but the census runs on Linux, so
  # process containment, os.replace sharing violations, Windows paths, NTFS SQLite and a Tk construction smoke are
  # exercised here (tools/ci/run_windows_lane.py owns the target list). It is a separate job name, so branch protection
  # decides when it becomes a required check; it never masks a failure and is not a substitute for GPU qualification.
  windows:
    needs: required
    if: needs.required.outputs.full_census == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Set up Python 3.14
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.14"

    - name: Install pinned tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run the Windows platform-contract lane
      shell: bash
      run: python tools/ci/run_windows_lane.py
