[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablenew"
version = "1.0.0"
description = "Stable Diffusion WebUI Automation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "StableNew Contributors"}
]
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "requests-mock>=1.11.0",
    "ruff==0.14.9",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "pre-commit>=3.0.0",
]
svd = [
    "torch>=2.4.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.34.0",
    "safetensors>=0.4.3",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.1",
    "opencv-python>=4.10.0",
    "facexlib>=0.3.0",
    "codeformer>=0.0.11",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | archive
  | ARCHIVE
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "ARCHIVE", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["B011"]  # assert False

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.gui.advanced_prompt_editor"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.gui.main_window"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--import-mode=importlib",
    "--ignore=tests/gui",
    "--ignore=tests/gui_v1_legacy",
    "--ignore=tests/legacy",
    "--ignore=tests/quarantine",
    "--ignore=tests/scripts",
]
norecursedirs = [
    "archive",
    "ARCHIVE",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "compat: compatibility or migration behavior; not target architecture",
    "core_e: core end-to-end path coverage",
    "golden_path: golden-path coverage",
    "gp1: golden-path step 1",
    "gp2: golden-path step 2",
    "gp3: golden-path step 3",
    "gp4: golden-path step 4",
    "gp5: golden-path step 5",
    "gp6: golden-path step 6",
    "gp7: golden-path step 7",
    "gp8: golden-path step 8",
    "gp9: golden-path step 9",
    "gp10: golden-path step 10",
    "gp11: golden-path step 11",
    "gp12: golden-path step 12",
    "gp13: golden-path step 13",
    "gp14: golden-path step 14",
    "gp15: golden-path step 15",
    "gui: tests that require or validate a GUI surface",
    "integration: cross-subsystem integration coverage",
    "journey: high-level product journey coverage",
    "legacy: retained legacy behavior; not target architecture",
    "real_backend: opt-in test that may contact an external backend",
    "slow: long-running coverage excluded from fast feedback",
    "smoke: bounded smoke coverage",
    "snapshot_regression: snapshot-based regression coverage",
    "summary: summary or reporting coverage",
    "timeout: marks tests that rely on pytest-timeout for execution limits",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/archive/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
