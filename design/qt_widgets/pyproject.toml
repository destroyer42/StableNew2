[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stablenew-qt-prototype-assessment"
version = "0.3.0"
description = "Isolated, non-generating PySide6 Qt Widgets prototype for the StableNew Create UX"
requires-python = ">=3.14,<3.15"
license = { text = "Private assessment - no standalone redistribution license selected" }
dependencies = ["PySide6==6.12.0"]

[tool.setuptools.packages.find]
include = ["stablenew_qt_proto*"]

[tool.setuptools.package-data]
stablenew_qt_proto = ["assets/*.svg"]
