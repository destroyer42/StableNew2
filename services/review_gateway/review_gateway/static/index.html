<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101216">
  <meta name="mobile-web-app-capable" content="yes">
  <title>StableNew Review</title>
  <!-- The server writes the version of the static files wherever {{V}} stands (static_files.py). -->
  <link rel="icon" href="/s/{{V}}/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/s/{{V}}/core/core.css">
  <link rel="stylesheet" href="/s/{{V}}/features/rating/rating.css">
  <script type="module" src="/s/{{V}}/core/main.js"></script>
</head>
<body>
  <header id="bar">
    <button id="back" type="button" aria-label="Back" hidden>&#8249;</button>
    <h1 id="title">Review</h1>
    <span id="unsent" role="status" hidden></span>
    <button id="waiting" type="button" hidden></button>
    <button id="rejected" type="button" hidden></button>
  </header>
  <main id="view"><p class="muted">Loading. If this stays, pull down to reload.</p></main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
